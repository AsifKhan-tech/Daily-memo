name: Deploy Daily Memo Application

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code # Checkout the local machine
        uses: actions/checkout@v5 # on to GitHub's machine

      - name: Login to Docker Hub # Login to
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }} # Docker

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        run: |
          docker build -t asifdotcom/daily-memo:backend ./server 
          docker push asifdotcom/daily-memo:backend

      - name: Deploy on ExCloud
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{secrets.SERVER_HOST}}
          username: ubuntu
          key: ${{ secrets.PRIVATE_KEY }}
          script: |
            # log in docker hub from VPS
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | sudo docker login -u "${{ vars.DOCKERHUB_USERNAME }}" --password-stdin

            # Stop the existing docker container
            sudo docker stop daily-memo-backend || true

            # Kill the existing docker container
            sudo docker rm daily-memo-backend || true

            # Again pull the fresh docker image from Docker Hub
            sudo docker pull asifdotcom/daily-memo:backend

            # Run docker -d -p 4000:4000 asifdotcom/daily-memo:backend
            sudo docker run --env-file ./server/.env -d --name daily-memo-backend --restart unless-stopped -p 4000:4000 asifdotcom/daily-memo:backend

            # clean up old/un-used images
            sudo docker image prune -f
