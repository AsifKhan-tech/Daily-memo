name: Deploy Backend
on:
  push:
    branches:
      - main
    paths:
      - "server/**" # It will run when anything change in backend
      - ".github/workflows/deploy-backend.yml"

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Backend
        run: |
          docker build -t asifdotcom/daily-memo:backend ./server 
          docker push asifdotcom/daily-memo:backend

      - name: Deploy Backend on ExCloud
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{secrets.SERVER_HOST}}
          username: ubuntu
          key: ${{ secrets.PRIVATE_KEY }}
          script: |
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | sudo docker login -u "${{ vars.DOCKERHUB_USERNAME }}" --password-stdin

            sudo docker network create memo-network || true

            # Stop, Kill, Pull, and Run the backend container
             sudo docker stop daily-memo-backend || true
             sudo docker rm daily-memo-backend || true

            sudo docker pull asifdotcom/daily-memo:backend
            sudo docker run --network memo-network --network-alias api --env-file /home/ubuntu/server/.env -d --name daily-memo-backend --restart unless-stopped -p 127.0.0.1:4000:4000 asifdotcom/daily-memo:backend

            sudo docker image prune -f
